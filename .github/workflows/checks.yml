name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `npm run build` runs tsc itself, so the type-check is the build's first
      # half; the explicit steps below run it once and then run only vite build.
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
